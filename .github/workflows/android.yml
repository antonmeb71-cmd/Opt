name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -n "$PKG" ]; then
          DIR=${PKG//./\/}
          mkdir -p "app/src/main/java/$DIR"
          mv -f *.kt "app/src/main/java/$DIR/" 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          sed -i -E 's/ ?android:(theme|icon|roundIcon)="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i -E 's/android:label="[^"]*"/android:label="Optimizer"/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "PLACEHOLDER_PKG"
              compileSdk = 34
              defaultConfig {
                  applicationId = "PLACEHOLDER_PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Optimizer"
          include(":app")
          EOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" app/build.gradle.kts

      - name: Patch Shizuku API
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          echo "MainActivity at: $KT"
          if [ -f "$KT" ] && grep -q "shizukuNewProcess" "$KT"; then
          echo "Already patched"
          elif [ -f "$KT" ]; then
          sed -i 's/Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          if ! grep -q "import rikka.shizuku.Shizuku" "$KT"; then
          sed -i "/^package /a import rikka.shizuku.Shizuku" "$KT"
          fi
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun shizukuNewProcess(cmds: Array<String>, env: Map<String, String>?, dir: String?): Process {' >> "$KT"
          printf '%s\n' '    val m = try {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Map::class.java, String::class.java)' >> "$KT"
          printf '%s\n' '    } catch (e: NoSuchMethodException) {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java)' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '    m.isAccessible = true' >> "$KT"
          printf '%s\n' '    return if (m.parameterTypes.size == 3) {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds, env, dir) as Process' >> "$KT"
          printf '%s\n' '    } else {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds) as Process' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          echo "Shizuku patch applied"
          else
          echo "MainActivity not found"
          fi

      - name: Apply Neon Cockpit Theme
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cockpit_bg">#FF05070F</color>
              <color name="cockpit_panel">#FF0B1E3A</color>
              <color name="neon_cyan">#FF00E5FF</color>
              <color name="neon_magenta">#FFFF2BD6</color>
              <color name="neon_amber">#FFFFB300</color>
              <color name="cockpit_text">#FFD9F6FF</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Optimizer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/cockpit_bg</item>
                  <item name="android:colorAccent">@color/neon_cyan</item>
                  <item name="android:statusBarColor">@color/cockpit_bg</item>
                  <item name="android:navigationBarColor">@color/cockpit_bg</item>
              </style>
          </resources>
          EOF
          MF=app/src/main/AndroidManifest.xml
          if [ -f "$MF" ] && ! grep -q "Theme.Optimizer" "$MF"; then
          sed -i 's/<application /<application android:theme="@style\/Theme.Optimizer" /' "$MF"
          fi
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          if [ -f "$KT" ] && grep -q "applyCockpitTheme" "$KT"; then
          echo "Theme already applied"
          elif [ -f "$KT" ]; then
          sed -i -E 's/^([[:space:]]*)(setContentView$.*)$/\1\2\n\1applyCockpitTheme()/' "$KT"
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun applyCockpitTheme() {' >> "$KT"
          printf '%s\n' '    val bg = android.graphics.Color.parseColor("#05070F")' >> "$KT"
          printf '%s\n' '    val cyan = android.graphics.Color.parseColor("#00E5FF")' >> "$KT"
          printf '%s\n' '    window.statusBarColor = bg' >> "$KT"
          printf '%s\n' '    window.navigationBarColor = bg' >> "$KT"
          printf '%s\n' '    val root = window.decorView.findViewById<android.view.View>(android.R.id.content)' >> "$KT"
          printf '%s\n' '    val grad = android.graphics.drawable.GradientDrawable(' >> "$KT"
          printf '%s\n' '        android.graphics.drawable.GradientDrawable.Orientation.TL_BR,' >> "$KT"
          printf '%s\n' '        intArrayOf(bg, android.graphics.Color.parseColor("#0B1E3A"), android.graphics.Color.parseColor("#1A0533"))' >> "$KT"
          printf '%s\n' '    )' >> "$KT"
          printf '%s\n' '    root.background = grad' >> "$KT"
          printf '%s\n' '    neonizeTree(root, cyan)' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun neonizeTree(v: android.view.View, cyan: Int) {' >> "$KT"
          printf '%s\n' '    when (v) {' >> "$KT"
          printf '%s\n' '        is android.widget.Button -> {' >> "$KT"
          printf '%s\n' '            v.backgroundTintList = android.content.res.ColorStateList.valueOf(cyan)' >> "$KT"
          printf '%s\n' '            v.setTextColor(android.graphics.Color.parseColor("#05070F"))' >> "$KT"
          printf '%s\n' '        }' >> "$KT"
          printf '%s\n' '        is android.widget.TextView -> {' >> "$KT"
          printf '%s\n' '            if (v !is android.widget.Button) {' >> "$KT"
          printf '%s\n' '                v.setTextColor(android.graphics.Color.parseColor("#D9F6FF"))' >> "$KT"
          printf '%s\n' '            }' >> "$KT"
          printf '%s\n' '        }' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '    if (v is android.view.ViewGroup) {' >> "$KT"
          printf '%s\n' '        for (i in 0 until v.childCount) {' >> "$KT"
          printf '%s\n' '            neonizeTree(v.getChildAt(i), cyan)' >> "$KT"
          printf '%s\n' '        }' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          echo "Cockpit theme applied"
          else
          echo "MainActivity not found"
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -n "$PKG" ]; then
          DIR=${PKG//./\/}
          mkdir -p "app/src/main/java/$DIR"
          mv -f *.kt "app/src/main/java/$DIR/" 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          sed -i -E 's/android:label="[^"]*"/android:label="Optimizer"/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "PLACEHOLDER_PKG"
              compileSdk = 34
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              defaultConfig {
                  applicationId = "PLACEHOLDER_PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Optimizer"
          include(":app")
          EOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" app/build.gradle.kts

      - name: Create stable signing key
        run: |
          mkdir -p app
          rm -f app/debug.keystore
          keytool -genkeypair -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "Stable keystore created"

      - name: Patch Shizuku API
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          echo "MainActivity at: $KT"
          if [ -f "$KT" ] && grep -q "shizukuNewProcess" "$KT"; then
          echo "Already patched"
          elif [ -f "$KT" ]; then
          sed -i 's/Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          if ! grep -q "import rikka.shizuku.Shizuku" "$KT"; then
          sed -i "/^package /a import rikka.shizuku.Shizuku" "$KT"
          fi
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun shizukuNewProcess(cmds: Array<String>, env: Map<String, String>?, dir: String?): Process {' >> "$KT"
          printf '%s\n' '    val m = try {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Map::class.java, String::class.java)' >> "$KT"
          printf '%s\n' '    } catch (e: NoSuchMethodException) {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java)' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '    m.isAccessible = true' >> "$KT"
          printf '%s\n' '    return if (m.parameterTypes.size == 3) {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds, env, dir) as Process' >> "$KT"
          printf '%s\n' '    } else {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds) as Process' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          echo "Shizuku patch applied"
          else
          echo "MainActivity not found"
          fi

      - name: Apply Neon Cockpit Theme
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cockpit_bg">#FF05070F</color>
              <color name="cockpit_panel">#FF0B1E3A</color>
              <color name="neon_cyan">#FF00E5FF</color>
              <color name="neon_magenta">#FFFF2BD6</color>
              <color name="neon_amber">#FFFFB300</color>
              <color name="cockpit_text">#FFD9F6FF</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Optimizer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/cockpit_bg</item>
                  <item name="android:colorAccent">@color/neon_cyan</item>
                  <item name="android:colorButtonNormal">@color/neon_cyan</item>
                  <item name="android:colorControlActivated">@color/neon_cyan</item>
                  <item name="android:colorControlHighlight">@color/neon_cyan</item>
                  <item name="android:textColor">@color/cockpit_text</item>
                  <item name="android:textColorPrimary">@color/cockpit_text</item>
                  <item name="android:textColorSecondary">@color/cockpit_text</item>
                  <item name="android:statusBarColor">@color/cockpit_bg</item>
                  <item name="android:navigationBarColor">@color/cockpit_bg</item>
              </style>
          </resources>
          EOF
          MF=app/src/main/AndroidManifest.xml
          if [ ! -f "$MF" ]; then
          echo "Manifest missing - generating from scratch"
          cat > "$MF" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application android:theme="@style/Theme.Optimizer" android:label="Optimizer" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="rikka.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:multiprocess="false" android:enabled="true" android:exported="true" android:directBootAware="true"/>
              </application>
          </manifest>
          EOF
          fi
          sed -i 's/android:theme="[^"]*"//g' "$MF"
          sed -i '0,/<application/s//<application android:theme="@style\/Theme.Optimizer" /' "$MF"
          if ! grep -q "Theme.Optimizer" "$MF"; then
          echo "Theme insert failed - regenerating manifest"
          cat > "$MF" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application android:theme="@style/Theme.Optimizer" android:label="Optimizer" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider android:name="rikka.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:multiprocess="false" android:enabled="true" android:exported="true" android:directBootAware="true"/>
              </application>
          </manifest>
          EOF
          fi
          if ! grep -q "WRITE_SETTINGS" "$MF"; then
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WRITE_SETTINGS"/>' "$MF"
          fi
          if ! grep -q "WRITE_SECURE_SETTINGS" "$MF"; then
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>' "$MF"
          fi
          if ! grep -q "ShizukuProvider" "$MF"; then
          sed -i 's|</application>|<provider android:name="rikka.shizuku.ShizukuProvider" android:authorities="${applicationId}.shizuku" android:multiprocess="false" android:enabled="true" android:exported="true" android:directBootAware="true"/>\n    </application>|' "$MF"
          fi
          grep -q "Theme.Optimizer" "$MF" && echo "Manifest theme: OK" || echo "Manifest theme: FAILED"
          grep -q "WRITE_SETTINGS" "$MF" && echo "Permissions: OK" || echo "Permissions: FAILED"
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          if [ -f "$KT" ] && grep -q "applyCockpitTheme" "$KT"; then
          echo "Theme already applied"
          elif [ -f "$KT" ]; then
          sed -i -E 's/^([[:space:]]*)(super\.onCreate$.*)$/\1setTheme(R.style.Theme_Optimizer)\n\1\2/' "$KT"
          sed -i -E 's/^([[:space:]]*)(setContentView$.*)$/\1\2\n\1applyCockpitTheme(this)/' "$KT"
          if ! grep -q "applyCockpitTheme(this)" "$KT"; then
          sed -i -E 's/^([[:space:]]*)(super\.onCreate$.*)$/\1\2\n\1applyCockpitTheme(this)/' "$KT"
          fi
          printf '%s' '' | base64 -d > /tmp/cockpit_patch.kt
          cat /tmp/cockpit_patch.kt >> "$KT"
          echo "Cockpit theme applied"
          grep -q "setTheme(R.style.Theme_Optimizer)" "$KT" && echo "setTheme hook: OK" || echo "setTheme hook: SKIPPED"
          grep -q "applyCockpitTheme(this)" "$KT" && echo "Code hook: OK" || echo "Code hook: SKIPPED"
          else
          echo "MainActivity not found"
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

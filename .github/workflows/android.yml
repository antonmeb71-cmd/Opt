name: Build Android APK with Rocket Icon

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate rocket launcher icon (Adaptive Icon)
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          # Vector rocket foreground (no ImageMagick needed, Android uses vectors)
          cat > app/src/main/res/drawable/rocket_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#FFD700"
                android:pathData="M54 12c-1.1 0-2.2.4-3.1 1.1l-18 14c-1.3 1-2.1 2.6-2.1 4.3v32c0 1.7.8 3.3 2.1 4.3l18 14c.9.7 2 1.1 3.1 1.1s2.2-.4 3.1-1.1l18-14c1.3-1 2.1-2.6 2.1-4.3V30.1c0-1.7-.8-3.3-2.1-4.3l-18-14c-.9-.7-2-.1-3.1-.1z"/>
            <path
                android:fillColor="#FF4500"
                android:pathData="M36 54h36v18H36z"/>
            <path
                android:fillColor="#FF6347"
                android:pathData="M45 72l-9-18h18l-9 18z"/>
          </vector>
          XML

          # Adaptive icon definition
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/rocket_foreground"/>
          </adaptive-icon>
          XML

          echo "Rocket launcher icon generated successfully"

      - name: Repair project layout & create build files
        run: |
          # Determine package name from existing Kotlin files or use default
          PKG=\$(grep -m1 '^package ' app/src/main/java/**/*.kt 2>/dev/null | head -n1 | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -z "\$PKG" ]; then
            echo "No Kotlin file with package found; using default package"
            PKG="com.example.optimizer"
          fi
          echo "Using package: \$PKG"

          DIR=\${PKG//./\/}
          mkdir -p "app/src/main/java/\$DIR"
          # Move any .kt files to the correct package directory if they are loose
          find . -maxdepth 2 -type f -name "*.kt" ! -path "*/\.git/*" ! -path "app/src/main/java/*" -exec mv {} "app/src/main/java/\$DIR/" \; 2>/dev/null || true

          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml

          cat > app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "\$PKG"
              compileSdk = 34
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              defaultConfig {
                  applicationId = "\$PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  
                  // Required

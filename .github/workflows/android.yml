name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -n "$PKG" ]; then
          DIR=${PKG//./\/}
          mkdir -p "app/src/main/java/$DIR"
          mv -f *.kt "app/src/main/java/$DIR/" 2>/dev/null || true
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "PLACEHOLDER_PKG"
              compileSdk = 34
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              defaultConfig {
                  applicationId = "PLACEHOLDER_PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Optimizer"
          include(":app")
          EOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" app/build.gradle.kts

      - name: Create stable signing key
        run: |
          mkdir -p app
          rm -f app/debug.keystore
          keytool -genkeypair -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "Stable keystore created"

      - name: Patch Shizuku API
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          echo "MainActivity at: $KT"
          if [ -f "$KT" ] && grep -q "shizukuNewProcess" "$KT"; then
          echo "Already patched"
          elif [ -f "$KT" ]; then
          sed -i 's/Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          if ! grep -q "import rikka.shizuku.Shizuku" "$KT"; then
          sed -i "/^package /a import rikka.shizuku.Shizuku" "$KT"
          fi
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun shizukuNewProcess(cmds: Array<String>, env: Map<String, String>?, dir: String?): Process {' >> "$KT"
          printf '%s\n' '    val m = try {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Map::class.java, String::class.java)' >> "$KT"
          printf '%s\n' '    } catch (e: NoSuchMethodException) {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java)' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '    m.isAccessible = true' >> "$KT"
          printf '%s\n' '    return if (m.parameterTypes.size == 3) {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds, env, dir) as Process' >> "$KT"
          printf '%s\n' '    } else {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds) as Process' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          echo "Shizuku patch applied"
          else
          echo "MainActivity not found"
          fi

      - name: Apply Starship Cockpit HUD
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          if [ -z "$KT" ]; then echo "MainActivity not found"; exit 1; fi
          PKG=$(grep -m1 '^package ' "$KT" | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -z "$PKG" ]; then echo "PKG not found"; exit 1; fi
          DIR=$(dirname "$KT")
          echo "PKG=$PKG DIR=$DIR"
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cockpit_bg">#FF05070F</color>
              <color name="neon_cyan">#FF00E5FF</color>
              <color name="cockpit_text">#FFD9F6FF</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Optimizer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/cockpit_bg</item>
                  <item name="android:colorAccent">@color/neon_cyan</item>
                  <item name="android:textColor">@color/cockpit_text</item>
                  <item name="android:statusBarColor">@color/cockpit_bg</item>
                  <item name="android:navigationBarColor">@color/cockpit_bg</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application
                  android:name=".App"
                  android:label="Optimizer"
                  android:theme="@style/Theme.Optimizer"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true"/>
              </application>
          </manifest>
          EOF
          cat > "$DIR/Cockpit.kt" <<'KEOF'
          package PLACEHOLDER_PKG

          import android.app.Activity
          import android.app.Application
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Random
          import kotlin.math.sin

          class SnowfallView(ctx: Context) : View(ctx) {
              var accent: Int = Color.CYAN
              private val n = 90
              private val sx = FloatArray(n)
              private val sy = FloatArray(n)
              private val ss = FloatArray(n)
              private val sv = FloatArray(n)
              private val sr = FloatArray(n)
              private val sph = FloatArray(n)
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var t = 0f
              private val ticker = object : Runnable {
                  override fun run() {
                      t += 0.006f
                      invalidate()
                      postDelayed(this, 50)
                  }
              }

              init {
                  val r = Random(2047)
                  for (i in 0 until n) {
                      sx[i] = r.nextFloat()
                      sy[i] = r.nextFloat()
                      ss[i] = r.nextFloat()
                      sv[i] = 0.25f + r.nextFloat() * 0.5f
                      sr[i] = 0.4f + r.nextFloat() * 1.2f
                      sph[i] = r.nextFloat() * 6.28f
                  }
                  post(ticker)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = resources.displayMetrics.density
                  for (i in 0 until n) {
                      var y = (sy[i] + t * sv[i]) % 1f
                      if (y < 0f) y += 1f
                      val sway = sin((t * 1.5f + sph[i]).toDouble()).toFloat() * 0.02f
                      val x = ((sx[i] + sway + 1f) % 1f) * w
                      val yy = y * h
                      val r = (2.5f + ss[i] * 4f) * d
                      val rot = t * sr[i] * 30f + sph[i]
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 1.3f * d
                      paint.color = if (ss[i] > 0.93f) accent else Color.WHITE
                      paint.alpha = (130f + 90f * ss[i]).toInt().coerceIn(60, 255)
                      drawFlake(canvas, x, yy, r, rot)
                  }
              }

              private fun drawFlake(c: Canvas, cx: Float, cy: Float, r: Float, rot: Float) {
                  for (k in 0 until 6) {
                      val a = Math.toRadians(rot + k * 60.0)
                      val dx = (Math.cos(a) * r).toFloat()
                      val dy = (Math.sin(a) * r).toFloat()
                      c.drawLine(cx, cy, cx + dx, cy + dy, paint)
                      val px = cx + dx * 0.6f
                      val py = cy + dy * 0.6f
                      val bl = r * 0.35f
                      for (b in intArrayOf(45, -45)) {
                          val ba = Math.toRadians(rot + k * 60.0 + b.toDouble())
                          c.drawLine(px, py, px + (Math.cos(ba) * bl).toFloat(), py + (Math.sin(ba) * bl).toFloat(), paint)
                      }
                  }
              }
          }

          class HudOverlay(ctx: Context) : View(ctx) {
              var accent: Int = Color.CYAN
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = resources.displayMetrics.density
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(16, 255, 255, 255)
                  var y = 0f
                  while (y < h) {
                      canvas.drawRect(0f, y, w, y + 1f, p)
                      y += 6f * d
                  }
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 3f * d
                  p.color = accent
                  val l = 26f * d
                  val m = 14f * d
                  canvas.drawLine(m, m, m + l, m, p)
                  canvas.drawLine(m, m, m, m + l, p)
                  canvas.drawLine(w - m - l, m, w - m, m, p)
                  canvas.drawLine(w - m, m, w - m, m + l, p)
                  canvas.drawLine(m, h - m, m + l, h - m, p)
                  canvas.drawLine(m, h - m, m, h - m - l, p)
                  canvas.drawLine(w - m - l, h - m, w - m, h - m, p)
                  canvas.drawLine(w - m, h - m, w - m, h - m - l, p)
              }
          }

          object Cockpit {
              val palettes: Array<Array<String>> = arrayOf(
                  arrayOf("#00E5FF", "#05070F", "#0B1E3A", "#1A0533", "#D9F6FF"),
                  arrayOf("#FF2BD6", "#12030F", "#2A0B33", "#33051F", "#FFD9F4"),
                  arrayOf("#FFB300", "#140B02", "#33260B", "#331F05", "#FFF0D9"),
                  arrayOf("#76FF03", "#04140A", "#0B3320", "#05330F", "#E9FFD9"),
                  arrayOf("#4CD964", "#000000", "#1C1C1E", "#111113", "#F2F2F2"),
                  arrayOf("#7FE9FF", "#04121D", "#0B2436", "#0F1B2E", "#E8FBFF")
              )

              fun savedIdx(a: Activity): Int {
                  val idx = a.getSharedPreferences("cockpit_prefs", 0).getInt("palette_idx", 0)
                  return if (idx in palettes.indices) idx else 0
              }

              fun apply(a: Activity, idx: Int) {
                  if (idx in palettes.indices) {
                      a.getSharedPreferences("cockpit_prefs", 0).edit().putInt("palette_idx", idx).apply()
                  }
                  val cur = savedIdx(a)
                  val p = palettes[cur]
                  val accent = Color.parseColor(p[0])
                  val base = Color.parseColor(p[1])
                  val dark1 = Color.parseColor(p[2])
                  val dark2 = Color.parseColor(p[3])
                  val text = Color.parseColor(p[4])
                  a.window.statusBarColor = base
                  a.window.navigationBarColor = base
                  val root = a.window.decorView.findViewById<View>(android.R.id.content) as ViewGroup
                  val grad = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(base, dark1, dark2))
                  root.background = grad
                  val dens = a.resources.displayMetrics.density
                  var star = root.findViewWithTag<View>("cockpit_stars")
                  if (star == null) {
                      val sf = SnowfallView(a)
                      sf.tag = "cockpit_stars"
                      root.addView(sf, 0, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      star = sf
                  }
                  (star as SnowfallView).accent = accent
                  var hud = root.findViewWithTag<View>("cockpit_hud")
                  if (hud == null) {
                      val ov = HudOverlay(a)
                      ov.tag = "cockpit_hud"
                      root.addView(ov, 1, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                      hud = ov
                  }
                  (hud as HudOverlay).accent = accent
                  var bar = root.findViewWithTag<ViewGroup>("cockpit_switcher")
                  if (bar == null) {
                      val nb = LinearLayout(a)
                      nb.tag = "cockpit_switcher"
                      nb.orientation = LinearLayout.VERTICAL
                      val bgd = GradientDrawable()
                      bgd.setColor(Color.parseColor("#CC06090F"))
                      bgd.setStroke((2 * dens).toInt(), accent)
                      nb.background = bgd
                      val title = TextView(a)
                      title.text = "OPTIMIZER // КОКПИТ СИСТЕМЫ"
                      title.setTextColor(accent)
                      title.textSize = 12f
                      title.typeface = Typeface.MONOSPACE
                      title.letterSpacing = 0.15f
                      title.setPadding((14 * dens).toInt(), (10 * dens).toInt(), (14 * dens).toInt(), 0)
                      nb.addView(title)
                      val row = LinearLayout(a)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER
                      row.setPadding(0, (4 * dens).toInt(), 0, (8 * dens).toInt())
                      nb.addView(row)
                      val line = View(a)
                      line.tag = "cockpit_line"
                      line.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (2 * dens).toInt())
                      line.setBackgroundColor(accent)
                      nb.addView(line)
                      nb.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      root.addView(nb)
                      bar = nb
                  }
                  for (i in 0 until root.childCount) {
                      val c = root.getChildAt(i)
                      if (c === bar || c.tag == "cockpit_stars" || c.tag == "cockpit_hud") {
                          continue
                      }
                      c.background = null
                      c.setPadding(c.paddingLeft, (96 * dens).toInt(), c.paddingRight, c.paddingBottom)
                  }
                  val row = bar.getChildAt(1) as ViewGroup
                  row.removeAllViews()
                  for (j in palettes.indices) {
                      val sw = View(a)
                      val size = (34 * dens).toInt()
                      val lp2 = LinearLayout.LayoutParams(size, size)
                      lp2.leftMargin = (8 * dens).toInt()
                      lp2.rightMargin = (8 * dens).toInt()
                      sw.layoutParams = lp2
                      val gd = GradientDrawable()
                      gd.shape = GradientDrawable.OVAL
                      gd.setColor(Color.parseColor(palettes[j][0]))
                      if (j == cur) {
                          gd.setStroke((3 * dens).toInt(), Color.WHITE)
                      } else {
                          gd.setStroke((1 * dens).toInt(), Color.parseColor(palettes[j][0]))
                      }
                      sw.background = gd
                      sw.setOnClickListener { apply(a, j) }
                      row.addView(sw)
                  }
                  val line = bar.findViewWithTag<View>("cockpit_line")
                  if (line != null) {
                      line.setBackgroundColor(accent)
                  }
                  val barGd = bar.background as GradientDrawable
                  barGd.setStroke((2 * dens).toInt(), accent)
                  hudize(root, accent, text, dens)
              }

              private fun hudize(v: View, accent: Int, text: Int, dens: Float) {
                  when (v) {
                      is Button -> {
                          val fill = Color.argb(46, Color.red(accent), Color.green(accent), Color.blue(accent))
                          val gd = GradientDrawable()
                          gd.setColor(fill)
                          gd.cornerRadius = 10f * dens
                          gd.setStroke((2 * dens).toInt(), accent)
                          val styled = v.background is GradientDrawable
                          v.background = gd
                          if (!styled) {
                              v.setPadding(v.paddingLeft, (12 * dens).toInt(), v.paddingRight, (12 * dens).toInt())
                          }
                          v.setTextColor(accent)
                          v.isAllCaps = false
                          v.typeface = Typeface.MONOSPACE
                          v.letterSpacing = 0.08f
                      }
                      is TextView -> {
                          if (v !is Button) {
                              v.setTextColor(text)
                              v.typeface = Typeface.MONOSPACE
                              v.letterSpacing = 0.03f
                              val styled = v.background is GradientDrawable
                              val pd = GradientDrawable()
                              pd.setColor(Color.argb(36, Color.red(accent), Color.green(accent), Color.blue(accent)))
                              pd.cornerRadius = 6f * dens
                              pd.setStroke((1 * dens).toInt(), Color.argb(130, Color.red(accent), Color.green(accent), Color.blue(accent)))
                              v.background = pd
                              if (!styled) {
                                  v.setPadding(v.paddingLeft + (12 * dens).toInt(), v.paddingTop + (8 * dens).toInt(), v.paddingRight + (12 * dens).toInt(), v.paddingBottom + (8 * dens).toInt())
                              }
                          }
                      }
                  }
                  if (v is ViewGroup) {
                      for (i in 0 until v.childCount) {
                          val child = v.getChildAt(i)
                          if (child.tag == "cockpit_switcher" || child.tag == "cockpit_stars" || child.tag == "cockpit_hud") {
                              continue
                          }
                          hudize(child, accent, text, dens)
                      }
                  }
              }
          }

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  registerActivityLifecycleCallbacks(object : Application.ActivityLifecycleCallbacks {
                      override fun onActivityResumed(a: Activity) {
                          a.window.decorView.post { Cockpit.apply(a, Cockpit.savedIdx(a)) }
                      }
                      override fun onActivityCreated(a: Activity, b: Bundle?) {}
                      override fun onActivityStarted(a: Activity) {}
                      override fun onActivityPaused(a: Activity) {}
                      override fun onActivityStopped(a: Activity) {}
                      override fun onActivitySaveInstanceState(a: Activity, b: Bundle) {}
                      override fun onActivityDestroyed(a: Activity) {}
                  })
              }
          }
          KEOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" "$DIR/Cockpit.kt"
          head -3 "$DIR/Cockpit.kt"
          grep -q "object Cockpit" "$DIR/Cockpit.kt" && echo "Cockpit: OK" || echo "Cockpit: FAILED"
          grep -q "class SnowfallView" "$DIR/Cockpit.kt" && echo "Snowfall: OK" || echo "Snowfall: FAILED"
          grep -q "#7FE9FF" "$DIR/Cockpit.kt" && echo "Palette6: OK" || echo "Palette6: FAILED"
          grep -q "class App" "$DIR/Cockpit.kt" && echo "Injector: OK" || echo "Injector: FAILED"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

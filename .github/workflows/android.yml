name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Обновленная версия, без предупреждений о deprecated
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle  # Автоматически кэширует зависимости, но без ручной настройки путей

      - name: Set up Gradle
        # Используем официальный экшен, он сам скачает нужную версию
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          # Проверяем, есть ли уже папка app, чтобы не ломать структуру при повторных запусках
          if [ ! -d "app" ]; then
            PKG=\$(grep -m1 '^package ' MainActivity.kt | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
            DIR=\${PKG//./\/}
            mkdir -p "app/src/main/java/\$DIR"
            mv -f *.kt "app/src/main/java/\$DIR/" 2>/dev/null || true
            mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml
            mkdir -p app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
            
            # Генерируем файлы сборки
            cat > app/build.gradle.kts <<EOF
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
            }
            android {
                namespace = "\$PKG"
                compileSdk = 34
                defaultConfig {
                    applicationId = "\$PKG"
                    minSdk = 26
                    targetSdk = 34
                    versionCode = 1
                    versionName = "1.0"
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
                lint {
                    abortOnError = false
                }
            }
            dependencies {
                implementation("dev.rikka.shizuku:api:13.1.5")
                implementation("dev.rikka.shizuku:provider:13.1.5")
            }
            EOF
            
            cat > build.gradle.kts <<EOF
            plugins {
                id("com.android.application") version "8.5.2" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            EOF
            
            cat > settings.gradle.kts <<EOF
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "Optimizer"
            include(":app")
            EOF
          fi

      - name: Build APK
        # --no-daemon обязателен для GitHub Actions, иначе сборка виснет
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

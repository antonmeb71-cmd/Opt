name: Build Android APK with Rocket Icon

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate rocket launcher icon (SVG + PNGs + adaptive)
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          # SVG rocket (golden body, orange-red flame)
          cat > rocket.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
            <path d="M54 12c-1.1 0-2.2.4-3.1 1.1l-18 14c-1.3 1-2.1 2.6-2.1 4.3v32c0 1.7.8 3.3 2.1 4.3l18 14c.9.7 2 1.1 3.1 1.1s2.2-.4 3.1-1.1l18-14c1.3-1 2.1-2.6 2.1-4.3V30.1c0-1.7-.8-3.3-2.1-4.3l-18-14c-.9-.7-2-.1-3.1-.1z" fill="#FFD700"/>
            <path d="M36 54h36v18H36z" fill="#FF4500"/>
            <path d="M45 72l-9-18h18l-9 18z" fill="#FF6347"/>
          </svg>
          SVG

          # Convert SVG to PNG for legacy mipmap densities
          convert -density 120 -resize 48x48 rocket.svg app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -density 120 -resize 72x72 rocket.svg app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -density 120 -resize 96x96 rocket.svg app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -density 120 -resize 144x144 rocket.svg app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -density 120 -resize 192x192 rocket.svg app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Adaptive icon foreground (vector)
          cat > app/src/main/res/drawable/rocket_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#FFD700"
                android:pathData="M54 12c-1.1 0-2.2.4-3.1 1.1l-18 14c-1.3 1-2.1 2.6-2.1 4.3v32c0 1.7.8 3.3 2.1 4.3l18 14c.9.7 2 1.1 3.1 1.1s2.2-.4 3.1-1.1l18-14c1.3-1 2.1-2.6 2.1-4.3V30.1c0-1.7-.8-3.3-2.1-4.3l-18-14c-.9-.7-2-.1-3.1-.1z"/>
            <path
                android:fillColor="#FF4500"
                android:pathData="M36 54h36v18H36z"/>
            <path
                android:fillColor="#FF6347"
                android:pathData="M45 72l-9-18h18l-9 18z"/>
          </vector>
          XML

          # Adaptive icon definition
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/transparent"/>
            <foreground android:drawable="@drawable/rocket_foreground"/>
          </adaptive-icon>
          XML

          echo "Rocket launcher icon generated successfully"

      - name:

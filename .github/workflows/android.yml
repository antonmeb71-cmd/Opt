name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -n "$PKG" ]; then
          DIR=${PKG//./\/}
          mkdir -p "app/src/main/java/$DIR"
          mv -f *.kt "app/src/main/java/$DIR/" 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          sed -i -E 's/ ?android:(theme|icon|roundIcon)="[^"]*"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          sed -i -E 's/android:label="[^"]*"/android:label="Optimizer"/g' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "PLACEHOLDER_PKG"
              compileSdk = 34
              defaultConfig {
                  applicationId = "PLACEHOLDER_PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Optimizer"
          include(":app")
          EOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" app/build.gradle.kts

      - name: Patch Shizuku API
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          echo "MainActivity at: $KT"
          if [ -f "$KT" ] && grep -q "Shizuku\.newProcess(" "$KT"; then
          sed -i 's/rikka\.shizuku\.Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          sed -i 's/Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          if ! grep -q "import rikka.shizuku.Shizuku" "$KT"; then
          sed -i "/^package /a import rikka.shizuku.Shizuku" "$KT"
          fi
          cat >> "$KT" <<'KTEOF'

private fun shizukuNewProcess(cmds: Array<String>, env: Map<String, String>?, dir: String?): Process {
    val m = try {
        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Map::class.java, String::class.java)
    } catch (e: NoSuchMethodException) {
        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java)
    }
    m.isAccessible = true
    return if (m.parameterTypes.size == 3) {
        m.invoke(null, cmds, env, dir) as Process
    } else {
        m.invoke(null, cmds) as Process
    }
}
KTEOF
          echo "Shizuku patch applied"
          else
          echo "Already patched or no direct call found"
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

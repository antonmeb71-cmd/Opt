name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Repair project layout
        run: |
          PKG=$(grep -m1 '^package ' MainActivity.kt 2>/dev/null | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -n "$PKG" ]; then
          DIR=${PKG//./\/}
          mkdir -p "app/src/main/java/$DIR"
          mv -f *.kt "app/src/main/java/$DIR/" 2>/dev/null || true
          mkdir -p app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Optimizer</string>\n</resources>\n' > app/src/main/res/values/strings.xml
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "PLACEHOLDER_PKG"
              compileSdk = 34
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              defaultConfig {
                  applicationId = "PLACEHOLDER_PKG"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Optimizer"
          include(":app")
          EOF
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" app/build.gradle.kts

      - name: Create stable signing key
        run: |
          mkdir -p app
          rm -f app/debug.keystore
          keytool -genkeypair -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "Stable keystore created"

      - name: Patch Shizuku API
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          echo "MainActivity at: $KT"
          if [ -f "$KT" ] && grep -q "shizukuNewProcess" "$KT"; then
          echo "Already patched"
          elif [ -f "$KT" ]; then
          sed -i 's/Shizuku\.newProcess(/shizukuNewProcess(/g' "$KT"
          if ! grep -q "import rikka.shizuku.Shizuku" "$KT"; then
          sed -i "/^package /a import rikka.shizuku.Shizuku" "$KT"
          fi
          printf '%s\n' '' >> "$KT"
          printf '%s\n' 'private fun shizukuNewProcess(cmds: Array<String>, env: Map<String, String>?, dir: String?): Process {' >> "$KT"
          printf '%s\n' '    val m = try {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java, Map::class.java, String::class.java)' >> "$KT"
          printf '%s\n' '    } catch (e: NoSuchMethodException) {' >> "$KT"
          printf '%s\n' '        Shizuku::class.java.getDeclaredMethod("newProcess", Array<String>::class.java)' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '    m.isAccessible = true' >> "$KT"
          printf '%s\n' '    return if (m.parameterTypes.size == 3) {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds, env, dir) as Process' >> "$KT"
          printf '%s\n' '    } else {' >> "$KT"
          printf '%s\n' '        m.invoke(null, cmds) as Process' >> "$KT"
          printf '%s\n' '    }' >> "$KT"
          printf '%s\n' '}' >> "$KT"
          echo "Shizuku patch applied"
          else
          echo "MainActivity not found"
          fi

      - name: Apply Neon Cockpit Theme
        run: |
          KT=$(find app/src/main/java -name "MainActivity.kt" 2>/dev/null | head -n1)
          if [ -z "$KT" ]; then echo "MainActivity not found"; exit 1; fi
          PKG=$(grep -m1 '^package ' "$KT" | sed 's/package //; s/[^a-zA-Z0-9_.].*//')
          if [ -z "$PKG" ]; then echo "PKG not found"; exit 1; fi
          DIR=$(dirname "$KT")
          echo "PKG=$PKG DIR=$DIR"
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="cockpit_bg">#FF05070F</color>
              <color name="neon_cyan">#FF00E5FF</color>
              <color name="cockpit_text">#FFD9F6FF</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Optimizer" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/cockpit_bg</item>
                  <item name="android:colorAccent">@color/neon_cyan</item>
                  <item name="android:textColor">@color/cockpit_text</item>
                  <item name="android:statusBarColor">@color/cockpit_bg</item>
                  <item name="android:navigationBarColor">@color/cockpit_bg</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <application
                  android:name=".App"
                  android:label="Optimizer"
                  android:theme="@style/Theme.Optimizer"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true"/>
              </application>
          </manifest>
          EOF
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML: VALID')"
          printf '%s' '' | base64 -d > "$DIR/Cockpit.kt"
          sed -i "s/PLACEHOLDER_PKG/$PKG/g" "$DIR/Cockpit.kt"
          head -3 "$DIR/Cockpit.kt"
          grep -q "class App" "$DIR/Cockpit.kt" && echo "Injector: OK" || echo "Injector: FAILED"
          grep -q "android:name=\".App\"" app/src/main/AndroidManifest.xml && echo "Manifest App: OK" || echo "Manifest App: FAILED"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
